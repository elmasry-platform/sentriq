project_id = "sentriq"

[api]
enabled = true
schemas = ["public", "graphql_public", "api", "core", "iam", "hse", "audit"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = false

# Public signup is closed by the Before User Created hook below: a signup is accepted only when it carries a
# valid, unexpired invitation token for the same email (private.validate_signup_invitation). The hosted TEST
# project needs the same hook set through the management API; scripts/signup_gate_canary.sh checks the wiring.
[auth]
enable_signup = true

[auth.email]
enable_confirmations = false

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/private/before_user_created_hook"
